worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Caddy sends the visitor's address in X-Real-IP; trust it only from the
    # private Docker networks Caddy connects from
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    server {
        listen 80 default_server;
        server_name _;

        # Caddy terminates HTTPS, so redirects nginx makes (such as adding a
        # trailing slash to a directory) must stay relative to keep the
        # visitor's scheme and hostname
        absolute_redirect off;

        root /usr/share/nginx/html;

        location / {
            index index.html;
            try_files $uri.html $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
