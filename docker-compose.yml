# Deployed by wetfish/server (https://github.com/wetfish/server), which builds
# this image from the pushed commit, connects the nginx service to its shared
# network, and serves it over HTTPS through Caddy.
#
# Keep this file free of container names, published ports, external networks
# and bind mounts; local development settings go in docker-compose.override.yml,
# which deploys leave out.
services:
  nginx:
    build:
      context: .
    restart: unless-stopped
